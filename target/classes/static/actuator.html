<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Envers Demo &middot; Actuator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark border-bottom border-primary border-3">
    <div class="container-fluid">
        <a class="navbar-brand fw-semibold" href="index.html">
            <i class="bi bi-clock-history text-primary me-1"></i>Envers Demo
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" href="index.html">
                        <i class="bi bi-box-seam me-1"></i>Products
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/swagger-ui/index.html" target="_blank">
                        <i class="bi bi-file-earmark-code me-1"></i>API docs
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/actuator" target="_blank">
                        <i class="bi bi-code-slash me-1"></i>Raw JSON
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/h2-console" target="_blank">
                        <i class="bi bi-database me-1"></i>H2 console
                    </a>
                </li>
                <li class="nav-item ms-lg-2">
                    <span class="navbar-text text-light-emphasis small" id="navWhoAmI"></span>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="/logout">
                        <i class="bi bi-box-arrow-right me-1"></i>Sign out
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container-fluid py-4 px-4">

    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
        <div>
            <h4 class="mb-0">Actuator</h4>
            <small class="text-muted">Live view over <code>/actuator/*</code> &mdash; nothing here is cached client-side.</small>
        </div>
        <button class="btn btn-outline-secondary btn-sm" id="btnRefreshAll">
            <i class="bi bi-arrow-clockwise me-1"></i>Refresh
        </button>
    </div>

    <ul class="nav nav-tabs" id="actuatorTabs">
        <li class="nav-item">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tab-health" type="button">
                <i class="bi bi-heart-pulse me-1"></i>Health
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-info" type="button">
                <i class="bi bi-info-circle me-1"></i>Info
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-metrics" type="button">
                <i class="bi bi-speedometer2 me-1"></i>Metrics
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-mappings" type="button">
                <i class="bi bi-signpost-split me-1"></i>Mappings
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-env" type="button">
                <i class="bi bi-sliders me-1"></i>Environment
            </button>
        </li>
        <li class="nav-item">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tab-beans" type="button">
                <i class="bi bi-diagram-3 me-1"></i>Beans
            </button>
        </li>
    </ul>

    <div class="tab-content border border-top-0 rounded-bottom bg-white p-3" id="actuatorTabContent">

        <!-- HEALTH -->
        <div class="tab-pane fade show active" id="tab-health">
            <div id="healthOverall" class="mb-3"></div>
            <div id="healthComponents" class="row g-3"></div>
        </div>

        <!-- INFO -->
        <div class="tab-pane fade" id="tab-info">
            <table class="table table-sm table-striped">
                <tbody id="infoRows"></tbody>
            </table>
        </div>

        <!-- METRICS -->
        <div class="tab-pane fade" id="tab-metrics">
            <div class="row g-3 mb-3" id="metricQuickStats"></div>
            <div class="row g-3">
                <div class="col-md-4">
                    <input type="search" class="form-control mb-2" id="metricFilter" placeholder="Filter metric names&hellip;">
                    <div class="list-group overflow-auto" id="metricList" style="max-height:420px"></div>
                </div>
                <div class="col-md-8">
                    <div id="metricDetail" class="text-muted">Pick a metric on the left to see its measurements and tags.</div>
                </div>
            </div>
        </div>

        <!-- MAPPINGS -->
        <div class="tab-pane fade" id="tab-mappings">
            <input type="search" class="form-control mb-2" id="mappingFilter" placeholder="Filter by path or handler&hellip;">
            <div class="table-responsive">
                <table class="table table-sm table-hover">
                    <thead class="table-light">
                        <tr><th style="width:130px">Method</th><th>Path</th><th>Handler</th></tr>
                    </thead>
                    <tbody id="mappingRows"></tbody>
                </table>
            </div>
        </div>

        <!-- ENV -->
        <div class="tab-pane fade" id="tab-env">
            <div class="input-group mb-3">
                <span class="input-group-text"><i class="bi bi-search"></i></span>
                <input type="search" class="form-control" id="envSearch" placeholder="Search a property name, e.g. spring.datasource.url">
            </div>
            <div id="envSearchResult" class="mb-4"></div>

            <h6 class="text-muted">Property sources</h6>
            <div class="accordion" id="envSourcesAccordion"></div>
        </div>

        <!-- BEANS -->
        <div class="tab-pane fade" id="tab-beans">
            <input type="search" class="form-control mb-2" id="beanFilter" placeholder="Filter by bean name or type&hellip;">
            <div class="table-responsive">
                <table class="table table-sm table-hover">
                    <thead class="table-light">
                        <tr><th>Bean name</th><th>Scope</th><th>Type</th><th class="text-end">Depends on</th></tr>
                    </thead>
                    <tbody id="beanRows"></tbody>
                </table>
            </div>
            <div class="text-muted small" id="beanCount"></div>
        </div>

    </div>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/actuator.js"></script>
</body>
</html>
