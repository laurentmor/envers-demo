<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Envers Demo &middot; Sign in</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="css/app.css" rel="stylesheet">
</head>
<body>

<div class="d-flex align-items-center justify-content-center" style="min-height:100vh">
    <div class="card shadow-sm" style="width:100%; max-width:380px">
        <div class="card-body p-4">
            <div class="text-center mb-4">
                <i class="bi bi-shield-lock text-primary" style="font-size:2rem"></i>
                <h5 class="mt-2 mb-0">Actuator access</h5>
                <small class="text-muted">Sign in to view health, metrics, mappings, env &amp; beans.</small>
            </div>

            <div id="loginAlert" class="alert alert-danger py-2 d-none">
                Invalid username or password.
            </div>
            <div id="logoutAlert" class="alert alert-success py-2 d-none">
                Signed out.
            </div>

            <form method="post" action="/login">
                <div class="mb-3">
                    <label class="form-label" for="username">Username</label>
                    <input type="text" class="form-control" id="username" name="username" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="password">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">
                    <i class="bi bi-box-arrow-in-right me-1"></i>Sign in
                </button>
            </form>

            <div class="text-center mt-3">
                <a href="index.html" class="small text-muted">&larr; Back to products</a>
            </div>
        </div>
    </div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    if (params.has('error')) document.getElementById('loginAlert').classList.remove('d-none');
    if (params.has('loggedout')) document.getElementById('logoutAlert').classList.remove('d-none');
</script>
</body>
</html>
