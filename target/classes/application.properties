spring.application.name=envers-demo

info.app.name=Envers Demo
info.app.description=Spring Boot CRUD + Hibernate Envers auditing demo
info.app.hibernate-version=7.4.1.Final

# --- Embedded in-memory H2 database ---
spring.datasource.url=jdbc:h2:mem:enversdemo;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at http://localhost:8080/h2-console (JDBC URL above, no password)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA / Hibernate ---
# create-drop is fine for this demo: schema (including the Envers _AUD tables
# and REVINFO) is generated fresh on every startup against the in-memory DB.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.highlight_sql=true

# --- Hibernate Envers ---
# Store REVEND/REVEND_TIMESTAMP so we can query "state as of a point in time",
# not just "state as of a revision number".
spring.jpa.properties.org.hibernate.envers.audit_table_suffix=_AUD
spring.jpa.properties.org.hibernate.envers.revision_field_name=REV
spring.jpa.properties.org.hibernate.envers.revision_type_field_name=REVTYPE
spring.jpa.properties.org.hibernate.envers.store_data_at_delete=true

# Required for AuditEntity.property(...).hasChanged() queries (used by the
# price-changes endpoint): adds a "_MOD" boolean column per audited property
# so changed-property queries don't have to diff revisions manually.
spring.jpa.properties.org.hibernate.envers.global_with_modified_flag=true

logging.level.org.hibernate.envers=DEBUG

# --- DevTools (hot reload) ---
# Both default to true when spring-boot-devtools is on the classpath; listed
# explicitly so it's obvious what's happening. restart fires on recompiled
# .class files; livereload additionally refreshes the browser for changes
# under static/** (html/css/js) without a full restart.
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# --- Actuator ---
# Wide open for local demo purposes only - do NOT expose all endpoints like
# this on anything that isn't your own machine.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.info.env.enabled=true

# --- Login (see SecurityConfig) ---
# Whole app requires login now; /actuator/** additionally requires the
# ACTUATOR_ADMIN role. Demo users (admin/admin, alice/alice, bob/bob) are
# defined as a UserDetailsService bean in SecurityConfig, not here - having
# more than one lets the Envers audit trail show different usernames.

# --- Swagger UI / OpenAPI (springdoc) ---
# UI:      http://localhost:8080/swagger-ui/index.html
# raw spec http://localhost:8080/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
